[package]
name = "disk-analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI framework (includes egui)
eframe = "0.27"

# Native file picker dialog
rfd = "0.14"

# Human-readable size formatting
humansize = "2"

# Cross-platform move to Trash
trash = "3"

# Spreadsheet export and safe replacement of completed reports
rust_xlsxwriter = { version = "0.102", features = ["constant_memory"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
